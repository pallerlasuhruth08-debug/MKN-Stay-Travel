# Fly.io app config. Before first deploy:
#   1. fly auth login
#   2. Change `app` below to a globally-unique name (or run `fly apps create <name>` first)
#   3. fly secrets set SUPABASE_URL=... SUPABASE_SERVICE_ROLE_KEY=...
#   4. fly deploy
#
# See README.md "Deploying" for the full walkthrough. The app is stateless
# (data lives in Supabase Postgres + Storage, not on local disk), so no
# persistent volume is needed here.

app = "mkn-stay-travel"
primary_region = "sin"

[build]

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
